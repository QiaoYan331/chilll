<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="暮色田野｜一張關於黃昏、稻田與回家路的照片。">
  <title>暮色田野｜Golden Hour</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #101418;
      --text: #f5f1e8;
      --muted: rgba(245, 241, 232, 0.68);
      --line: rgba(255, 255, 255, 0.18);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC",
        "PingFang TC", "Microsoft JhengHei", sans-serif;
      overflow-x: hidden;
    }

    .hero {
      position: relative;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: flex-end;
      overflow: hidden;
      isolation: isolate;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -3;
      background: linear-gradient(
        to bottom,
        rgba(4, 10, 18, 0.08) 0%,
        rgba(4, 10, 18, 0.03) 35%,
        rgba(4, 10, 18, 0.28) 65%,
        rgba(4, 8, 12, 0.88) 100%
      );
    }

    .hero-image {
      position: absolute;
      inset: 0;
      z-index: -4;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      animation: slowZoom 18s ease-out both;
    }

    .hero-content {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 0 7vw 8vh;
      position: relative;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
      font-size: 0.78rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .eyebrow::before {
      content: "";
      width: 42px;
      height: 1px;
      background: rgba(255,255,255,.55);
    }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 400;
      font-size: clamp(4rem, 10vw, 9rem);
      line-height: 0.88;
      letter-spacing: -0.055em;
      margin-bottom: 28px;
      text-shadow: 0 8px 35px rgba(0,0,0,.3);
    }

    .subtitle {
      max-width: 580px;
      color: rgba(255,255,255,.82);
      font-size: clamp(1rem, 2vw, 1.25rem);
      line-height: 1.9;
      letter-spacing: 0.06em;
    }

    .scroll-hint {
      position: absolute;
      right: 7vw;
      bottom: 8vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: rgba(255,255,255,.62);
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      writing-mode: vertical-rl;
    }

    .scroll-hint::after {
      content: "";
      width: 1px;
      height: 58px;
      background: linear-gradient(to bottom, rgba(255,255,255,.65), transparent);
    }

    .section {
      width: min(1000px, calc(100% - 40px));
      margin: 0 auto;
      padding: 120px 0;
    }

    .intro {
      display: grid;
      grid-template-columns: 1fr 1.5fr;
      gap: 80px;
      align-items: start;
    }

    .section-label {
      color: rgba(255,255,255,.45);
      font-size: 0.72rem;
      letter-spacing: .25em;
      text-transform: uppercase;
      padding-top: 8px;
    }

    .intro-text {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.7rem, 4vw, 3rem);
      line-height: 1.35;
      font-weight: 400;
    }

    .intro-text span {
      color: rgba(255,255,255,.42);
    }

    .divider {
      width: 100%;
      height: 1px;
      background: var(--line);
    }

    .details {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: var(--line);
    }

    .detail {
      background: var(--bg);
      padding: 34px 28px;
    }

    .detail small {
      display: block;
      margin-bottom: 10px;
      color: rgba(255,255,255,.4);
      font-size: .68rem;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .detail strong {
      font-size: 1rem;
      font-weight: 400;
      letter-spacing: .04em;
    }

    .quote {
      min-height: 58vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    blockquote {
      max-width: 850px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.2rem, 6vw, 5.5rem);
      line-height: 1.08;
      font-weight: 400;
      letter-spacing: -.035em;
    }

    blockquote::before {
      content: "“";
      display: block;
      color: rgba(255,255,255,.25);
      font-size: 4rem;
      line-height: .7;
      margin-bottom: 24px;
    }

    footer {
      border-top: 1px solid var(--line);
      width: min(1000px, calc(100% - 40px));
      margin: 0 auto;
      padding: 32px 0 42px;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      color: rgba(255,255,255,.4);
      font-size: .75rem;
      letter-spacing: .1em;
    }

    .hero-content {
      animation: rise 1.2s cubic-bezier(.2,.7,.2,1) .15s both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(28px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slowZoom {
      from { transform: scale(1.04); }
      to { transform: scale(1); }
    }

    @media (max-width: 700px) {
      .hero {
        min-height: 88svh;
      }

      .hero-image {
        object-position: 48% center;
      }

      .hero-content {
        padding: 0 24px 50px;
      }

      h1 {
        font-size: clamp(3.8rem, 20vw, 6rem);
      }

      .subtitle {
        font-size: .95rem;
        line-height: 1.75;
      }

      .scroll-hint {
        display: none;
      }

      .section {
        width: min(100% - 48px, 1000px);
        padding: 82px 0;
      }

      .intro {
        grid-template-columns: 1fr;
        gap: 30px;
      }

      .details {
        grid-template-columns: 1fr;
      }

      .detail {
        padding: 25px 20px;
      }

      .quote {
        min-height: 48vh;
      }

      footer {
        width: calc(100% - 48px);
        flex-direction: column;
        line-height: 1.7;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      .hero-image,
      .hero-content {
        animation: none;
      }
    }
  </style>
</head>
